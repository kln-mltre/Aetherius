# Phase 1.5 - Jalon F (brouillon a finaliser ; voir docs/phase-1.5/f-deployment.md).
# Fait tourner le daemon Aetherius 24/7. Le volume nomme conserve la base SQLite (schedules,
# historique) et les profils entre redemarrages.

services:
  aetherius:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      # Par defaut on n'expose que sur la loopback de l'hote. Retirer 127.0.0.1 seulement derriere
      # un reverse proxy TLS, et avec un token defini.
      - "127.0.0.1:8787:8787"
    environment:
      AETHERIUS_DATA_DIR: /data
      AETHERIUS_DAEMON_HOST: 0.0.0.0
      # Secrets et token via un fichier .env non versionne (voir docs/secrets.md).
      AETHERIUS_DAEMON_TOKEN: ${AETHERIUS_DAEMON_TOKEN:-}
    env_file:
      - .env
    volumes:
      - aetherius-data:/data

volumes:
  aetherius-data:
